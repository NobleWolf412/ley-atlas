<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Ley Atlas</title>
    <meta
      name="description"
      content="Interactive map of ley lines, ancient monuments and star forts, with what lies along each line underground."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="app">
      <div id="mapwrap">
        <canvas
          id="map"
          aria-label="Interactive map of alignments, monuments and star forts"
          role="img"
        ></canvas>
        <div class="topbar">
          <div class="brand">
            <h1>Ley Line &amp; Star Fort Network</h1>
            <p id="readout">—</p>
          </div>
          <div class="spacer"></div>
          <div class="seg" role="group" aria-label="View">
            <button id="v-map" aria-pressed="true">Map</button>
            <button id="v-globe" aria-pressed="false">Globe</button>
          </div>
          <button class="iconbtn" id="themebtn" title="Light or dark" aria-label="Switch light or dark theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
              <circle cx="12" cy="12" r="4.5" />
              <path
                d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"
              />
            </svg>
          </button>
        </div>
        <div class="linechip" id="linechip"></div>
        <svg id="reticle" hidden viewBox="-22 -22 44 44" aria-hidden="true">
          <circle r="12" fill="none" stroke="#fff" stroke-width="4" />
          <circle r="12" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M0-21V-6M0 6V21M-21 0H-6M6 0H21" stroke="#fff" stroke-width="4" />
          <path d="M0-21V-6M0 6V21M-21 0H-6M6 0H21" stroke="currentColor" stroke-width="2" />
          <circle r="1.6" fill="currentColor" />
        </svg>
        <a id="street" hidden href="#" target="_blank" rel="noopener"
          >No street detail here · <b>Open in Google Maps ↗</b></a
        >
        <div class="fab">
          <button class="iconbtn" id="lyr" title="Layers" aria-label="Layers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M12 3l9 5-9 5-9-5 9-5z" />
              <path d="M3 13l9 5 9-5" />
            </svg>
          </button>
          <button class="iconbtn" id="zin" title="Zoom in" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <button class="iconbtn" id="zout" title="Zoom out" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14" />
            </svg>
          </button>
          <button class="iconbtn" id="home" title="Reset view" aria-label="Reset view">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 3v18M7 21h10M9 8l3-5 3 5" />
            </svg>
          </button>
          <a
            class="iconbtn"
            id="satlink"
            href="#"
            target="_blank"
            rel="noopener"
            title="Open this spot in Google Maps"
            aria-label="Open this spot in Google Maps"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="9" width="7" height="6" rx="1" />
              <rect x="14" y="9" width="7" height="6" rx="1" />
              <path d="M10 12h4M12 6v3M9 3l3 3 3-3" /></svg
          ></a>
        </div>
        <div class="hud">
          <div id="v2zoomnote" hidden></div>
          <div id="scaletxt">—</div>
          <div id="scalebar" class="scalebar"></div>
        </div>
        <div class="attrib" id="attrib">Natural Earth</div>
        <div class="key" id="key"></div>
        <button class="keybtn" id="keybtn" hidden>Key</button>
        <div id="callout" class="callout" hidden></div>
        <div id="banner" class="banner" hidden>
          <span id="bannertxt"></span><button class="btn primary" id="bannerdone">Done</button>
        </div>
        <div id="ticker" class="ticker" hidden>
          <span id="tickertxt"></span><button id="tickerstop">Stop</button>
        </div>
        <button id="skip" hidden>Skip intro</button>
        <button id="explore" hidden>EXPLORE THE GLOBAL NETWORK</button>
        <button id="addhere" hidden>+ Add point</button>
        <div id="v2bar" aria-label="Map actions">
          <button class="v2-mapbtn" id="v2-menu" aria-label="Menu">☰</button
          ><button class="v2-mapbtn v2-searchbtn" id="v2-search">
            <svg
              viewBox="0 0 24 24"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-4-4" /></svg
            >Search sites</button
          ><button class="v2-mapbtn primary" id="v2-draw" hidden>✕ Cancel drawing</button>
        </div>
        <div id="v2hint" role="status" aria-live="polite" hidden></div>
        <div id="v2layers" hidden role="dialog" aria-label="Layers">
          <div id="v2layers-top"></div>
          <section id="p-layers"></section>
        </div>
        <div id="v2alert" hidden role="status" aria-live="polite"></div>
        <button id="v2cta" hidden>＋ Draw a line</button>

        <div id="toast" hidden role="status" aria-live="polite"></div>
      </div>
      <aside id="sheet" class="peek">
        <button class="grab" id="grab" aria-label="Resize panel"></button>
        <div id="v2tools" hidden>
          <button id="v2hostback" class="v2-hostback">← Back</button><b id="v2hosttitle"></b>
        </div>
        <section class="pane" id="p-lab" hidden></section>
        <section class="pane" id="p-data" hidden></section>
        <section class="pane" id="p-detail" hidden></section>
        <section id="v2panel" role="tabpanel"></section>
      </aside>
    </div>
    <div id="modal" class="modal" hidden>
      <div class="box">
        <div class="head">
          <b id="modaltitle"></b><button class="btn ghost" id="modalclose">Close</button>
        </div>
        <div id="modalbody" class="stack"></div>
      </div>
    </div>
    <div id="v2browser" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="v2btitle">
      <div class="box">
        <div class="head">
          <b id="v2btitle">Choose a site</b><button class="btn ghost" id="v2bclose">Close</button>
        </div>
        <div id="v2bbody" class="v2b"></div>
      </div>
    </div>
    <div id="picker" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="picktitle">
      <div class="box">
        <div class="head"><b id="picktitle"></b><button class="btn ghost" id="pickclose">Close</button></div>
        <div class="searchbox">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-4-4" /></svg
          ><input
            type="search"
            id="pickq"
            placeholder="Type to search"
            autocomplete="off"
            aria-label="Search the list"
          />
        </div>
        <div class="chips" id="pickchips"></div>
        <div id="pickbody"></div>
      </div>
    </div>
    <div id="boot" role="status" aria-live="polite">Loading Ley Atlas…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
